<div id="shelves" data-on="load" data-event="music:pause">
  <div>
    <nav class="bookmarks">
      <ul class="unstyled">
        <li><button type="button" class="danger" data-event="effect:screen_off|screen:turn-off|scene:title|effect:screen_on|screen:turn-on" aria-label="Title"><i aria-hidden="true" class="icon home"></i></button></li>
        <li><button type="button" class="muted" data-event="dialog:settings" aria-label="Settings"><i aria-hidden="true" class="icon wrench"></i></button></li>
      </ul>
    </nav>
    <form>
      <fieldset>
        <legend data-i18n="pick_shelf"><span data-i18n-content>#</span></legend>
        <div class="cols">
          <label data-on="focusin" data-event="effect:card_select" class="box">
            <input data-on="submit" data-event="screen:value=shelf,shelf-x=1,shelf-y=1|effect:screen_off|screen:turn-off|scene:chapter|effect:screen_on|screen:turn-on" class="arrow-right" type="radio" name="shelf">
            Horror<br />
            <img src="https://placehold.co/600x400" width="600" height="400" alt="" class="img-fluid">
            Lorem ipsum dolor sit amet, consectetuer adipiscing elit
          </label>
          <label data-on="focusin" data-event="effect:card_select" class="box">
            <input data-on="submit" data-event="screen:value=shelf,shelf-x=1,shelf-y=-1|effect:screen_off|screen:turn-off|scene:chapter|effect:screen_on|screen:turn-on" class="arrow-right" type="radio" name="shelf">
            Fantasy<br />
            <img src="https://placehold.co/600x400" width="600" height="400" alt="" class="img-fluid">
            Aenean commodo ligula eget dolor. Aenean massa
          </label>
          <label data-on="focusin" data-event="effect:card_select" class="box">
            <input data-on="submit" data-event="screen:value=shelf,shelf-x=-1,shelf-y=-1|effect:screen_off|screen:turn-off|scene:chapter|effect:screen_on|screen:turn-on" class="arrow-right" type="radio" name="shelf">
            Science fiction<br />
            <img src="https://placehold.co/600x400" width="600" height="400" alt="" class="img-fluid">
            Lorem ipsum dolor sit amet, consectetuer adipiscing elit
          </label>
        </div>
        <p class="align-center">
          <button type="submit" class="light" data-i18n="play"><span data-i18n-content>#</span></button>
        </p>
      </fieldset>
    </form>
  </div>
</div>
