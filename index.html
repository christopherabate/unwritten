<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="./assets/styles/styles.css">
    <title>unwritten_</title>
  </head>
  <body>
    <main id="monitor">
      <div id="screen">
        <div id="scene">
          <p class="align-center">Loading&hellip;</p>
          <noscript><p>JavaScript is required.</p></noscript>
        </div>

        <dialog id="settings" class="box">
          <div>
            <h2>Settings</h2>
            <form method="dialog">
              <fieldset>
                <legend>Enable shader overlay?</legend>
                <label><input data-on="change" data-event="monitor:shader" class="tick" type="radio" name="shader" value="on"> Yes</label>
                <label><input data-on="change" data-event="monitor:shader" class="cross" type="radio" name="shader" value="off"> No</label>
              </fieldset>
              <fieldset>
                <legend>Volume</legend>
                <div><label>Music <input data-on="input" data-event="volume:music" type="range" name="music" value=".5" step=".1" min="0" max="1"></label></div>
                <div><label>Effects <input data-on="input" data-event="volume:effects" type="range" name="effects" value=".5" step=".1" min="0" max="1"></label></div>
              </fieldset>
              <fieldset>
                <legend>Text</legend>
                <label><input type="text"> Text</label>
              </fieldset>
              <fieldset>
                <legend>Enable glitch effects?</legend>
                <label><input data-on="change" data-event="monitor:glitch" class="tick" type="radio" name="glitch" value="on"> Yes</label>
                <label><input data-on="change" data-event="monitor:glitch" class="cross" type="radio" name="glitch" value="off"> No</label>
              </fieldset>
              <fieldset>
                <legend>An other way to activate shaders</legend>
                <label><input data-on="change" data-event="monitor:shader" type="checkbox" name="shader"> Shader?</label>
              </fieldset>
              <button data-event="screen:standby|screen" type="submit" class="light block"><span aria-hidden="true" class="icon cross"></span>Close</button>
            </form>
          </div>
        </dialog>

        <dialog id="credits" class="box">
          <div>
            <h2>Credits</h2>
            <p>Pixel-handcrafted by <a href="https://github.com/christopherabate">@christopherabate</a></p>
            <p>Music by <a href="https://yannz.itch.io">YannZ</a></p>
            <p>WCAG 2.2 AA compliant.</p>
            <div class="sprite">
              <img class="wind" src="./assets/images/sprites/character.png" alt="character" />
            </div>
            <form method="dialog">
              <button data-event="screen:standby|screen" type="submit" class="light block"><span aria-hidden="true" class="icon cross"></span>Close</button>
            </form>
          </div>
        </dialog>

        <audio id="music" src="./assets/audio/tracks/title.ogg" loop hidden preload="auto"></audio>
        <audio id="effects" hidden preload="auto"></audio>
      </div>
    </main>
    
    <script type="module" src="./assets/js/scripts.js"></script>
  </body>
</html>
