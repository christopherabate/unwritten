<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="./assets/styles/styles.css">
    <title>unwritten_</title>
  </head>
  <body>
    <main id="monitor">
      <div id="screen" class="turn-on">
        <div id="scene">
          <div id="menu">
            <div>
              <h1 class="unwritten align-center">unwritten</h1>
              <div class="cols">
                <ul class="unstyled align-start">
                  <li><button type="button" class="primary" disabled>Continue<span aria-hidden="true" class="icon interactive arrow-left"></span></button></li>
                  <li><button type="button" class="primary" data-action="shutter:turn-off|goto:book|shutter:turn-on">New game<span aria-hidden="true" class="icon interactive arrow-left"></span></button></li>
                </ul>
                <ul class="unstyled align-end">
                  <li><button type="button" class="link light" data-action="dialog:settings"><span aria-hidden="true" class="icon interactive arrow-right"></span>Settings</button></li>
                  <li><button type="button" class="link light" data-action="dialog:credits"><span aria-hidden="true" class="icon interactive arrow-right"></span>Credits</button></li>
                </ul>
              </div>
            </div>
          </div>
        </div>
        
        <dialog id="settings" class="box">
          <div>
            <h2>Settings</h2>
            <form method="dialog">
              <fieldset>
                <legend>Enable shader overlay?</legend>
                <label><input data-action="shader" class="tick" type="radio" name="shader" value="1"> Yes</label>
                <label><input data-action="shader" class="cross" type="radio" name="shader" value="0"> No</label>
              </fieldset>
              <fieldset>
                <legend>Volume</legend>
                <div><label>Music <input data-action="volume:music" type="range" name="music" value=".5" step=".1" min="0" max="1"></label></div>
                <div><label>Effects <input data-action="volume:effects" type="range" name="effects" value=".5" step=".1" min="0" max="1"></label></div>
              </fieldset>
              <fieldset>
                <legend>Text</legend>
                <label><input type="text"> Text</label>
              </fieldset>
              <fieldset>
                <legend>An other way to activate shaders</legend>
                <label><input data-action="shader" type="checkbox" name="shader"> Shader?</label>
              </fieldset>
              <button data-action="standby" type="submit" class="light block"><span aria-hidden="true" class="icon cross"></span>Close</button>
            </form>
          </div>
        </dialog>

        <dialog id="credits" class="box">
          <div>
            <h2>Credits</h2>
            <p>Pixel-handcrafted by <a href="https://github.com/christopherabate">@christopherabate</a></p>
            <p>Music by <a href="https://yannz.itch.io">YannZ</a></p>
            <p>WCAG 2.2 AA compliant.</p>
            <div class="sprite">
              <img class="wind" src="./assets/images/sprites/character.png" alt="character" />
            </div>
            <form method="dialog">
              <button data-action="standby" type="submit" class="light block"><span aria-hidden="true" class="icon cross"></span>Close</button>
            </form>
          </div>
        </dialog>

        <audio id="music" src="./assets/audio/tracks/title.ogg" loop hidden preload="auto"></audio>
        <audio id="effects" loop hidden preload="auto"></audio>
      </div>
    </main>
    <script src="./assets/js/scripts.js"></script>
  </body>
</html>
